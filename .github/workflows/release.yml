name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p miwifi-recovery-core -p miwifi-recovery-cli
      - run: node --check app/ui/app.js && node --check app/ui/i18n.js

  cli:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, exe: "" }
          - { os: macos-latest, name: macos-arm64, exe: "" }
          - { os: windows-latest, name: windows-x64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p miwifi-recovery-cli
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/miwifi-recovery-cli${{ matrix.exe }} dist/miwifi-recovery-cli-${{ matrix.name }}${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with: { name: "cli-${{ matrix.name }}", path: dist/* }

  gui-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p miwifi-recovery
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: app/src-tauri
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/miwifi-recovery.exe dist/
          cp target/release/bundle/nsis/*.exe dist/
          cd dist && for f in *" "*; do [ -e "$f" ] && mv "$f" "${f// /-}"; done; ls -la
      - uses: actions/upload-artifact@v4
        with: { name: gui-windows, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
